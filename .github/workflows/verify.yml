name: Verify SAT solver and measured evidence
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/verify_results.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/run_study.py --quick --output-dir build/ci
      - run: python scripts/verify_results.py --output-dir build/ci
      - run: java -cp build/ci/build/classes lab.Solve inputs/budget-exhaustion.cnf 0 WATCHED
      - uses: actions/upload-artifact@v4
        with:
          name: fresh-solver-study
          path: |
            build/ci/inputs
            build/ci/results
            build/ci/docs
